# Checks every push and pull request: the dashboard builds (with lint and type checks), the Python code
# compiles and the API answers, and the VPS shell scripts pass shellcheck.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  python:
    name: Python compile + API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/requirements.txt
      - run: pip install -r deploy/requirements.txt httpx
      - name: Compile every Python file
        run: python -m compileall -q -x '(node_modules|\.next)' .
      - name: API smoke test (local mode, no network)
        run: python tests/smoke_api.py
      - name: SMC playbook engine, scanner and agent (offline)
        run: python tests/test_smc_playbook.py
      - name: A-B-C-D entry acceptance tests (offline)
        run: python tests/test_abcd.py
      - name: Stops / targets touched between two runner checks exit at that level (offline)
        run: python tests/test_intrabar_exits.py
      - name: Live quotes never freeze (newest of meta / 1-minute close, 5-minute fallback) (offline)
        run: python tests/test_quotes.py
      - name: Trade Manager reactions (breakeven, profit lock, reversal, no follow-through) (offline)
        run: python tests/test_trade_manager.py
      - name: US long entry live-price check (offline)
        run: python tests/test_us_long_entry.py
      - name: Zerodha data only - order endpoints refused, login, instruments, ticks (offline)
        run: python tests/test_kite.py
      - name: F&O stocks as ATM options - contract, premium stop / target, sizing, switch (offline)
        run: python tests/test_fno_stock.py
      - name: Stock-option backtest pricing - theta, spread, charges, account fit (offline)
        run: python tests/test_fno_sv4.py
      - name: Scanner v4 = only v4 (rules paths off per account), v4 setup ticks, every market's settings (offline)
        run: python tests/test_v4_only.py
      - name: US F&O (QQQ / SPY options, USFNO account, Alpaca options data guard, Nasdaq-100, backtest; offline)
        run: python tests/test_us_fno.py
      - name: Your opinion (questions, validation, versions, export; offline)
        run: python tests/test_opinion.py
      - name: View on chart API (candles, levels, broker links; offline)
        run: python tests/test_chart.py
      - name: Trade Manager settings (v4 trailing per account; engine, paper, backtest, API) (offline)
        run: python tests/test_tm_settings.py
      - name: F&O own paper account (FNO Rs 1,00,000, INDIA stocks Rs 50,000), one-time split, Nifty + Bank Nifty (offline)
        run: python tests/test_fno_account.py
      - name: Live crypto prices (Coinbase public data only) - no key, private / order endpoints refused, ticks (offline)
        run: python tests/test_crypto_live.py
      - name: Live US prices (Alpaca market data) - paper key only, trading API refused, snapshots, ticks (offline)
        run: python tests/test_alpaca.py
      - name: Scanner v5 - the 0.146 level, cancels, mirror, naming, account gating (offline)
        run: python tests/test_scanner_v5.py
      - name: Scanner v6 as a V4 Scanner version (Settings option; V6 Modules A-D, V4 agents) (offline)
        run: python tests/test_scanner_v6_option.py
      - name: Dashboard watch lists (NSE / US quotes and breaks) (offline)
        run: python tests/test_watchlists.py
      - name: Scanner v2 finds the owner's setups, the agents record them, no trade (offline)
        run: python tests/test_scanner_setups.py
      - name: Bigger picture (pov.py) - 4h / weekly / monthly candles, last complete v4 setup, file, endpoint (offline)
        run: python tests/test_pov.py
      - name: Scanner v4 acceptance tests (primary, sequential OB/FVG secondary, version gate) (offline)
        run: python tests/test_scanner_v4.py
      - name: Scanner v4 sweep from the BOS start + target from the opposite BOS (owner, 17 Nov) (offline)
        run: python tests/test_v4_sweep_target.py
      - name: Budget of 17 Nov (Rs 1 lakh / $1,000, 3% a trade), applied once to config and ledger (offline)
        run: python tests/test_budget.py
      - name: Scanner v4 flip rule (previous day's BOS trade -> today's opposite BOS setup) (offline)
        run: python tests/test_v4_flip.py
      - name: Scanner v3 sweep reversal + FVG/OB retest acceptance tests, v2 rollback (offline)
        run: python tests/test_sweep_reversal.py
      - name: Intraday margin (5x India / 4x US) + v4 time machine + its logs API (offline)
        run: python tests/test_margin_tm.py
      - name: No late entry and margin-aware sizing
        run: python tests/test_no_late_entry.py
      - name: Research cost model (NSE / US / crypto, long and short; offline)
        run: python tests/test_research_costs.py
      - name: Cost-aware eligibility min_net_rr, long and mirrored short, off by default (offline)
        run: python tests/test_cost_ok_sides.py
      - name: No daily trade-count limit on any paper account; the other guards still block (offline)
        run: python tests/test_no_daily_trade_cap.py

  v6:
    # Scanner V6 (research, PAPER ONLY: no broker or order path). Standard library + pytest only; no network.
    name: Scanner V6 tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest "fastapi==0.115.6" httpx
      - name: V6 full suite (pytest)
        run: python -B -m pytest -q -p no:cacheprovider -rs tests/scanner_v6
      - name: V6 paper runtime, backtesting, ledger, data adapters, API, deploy scripts and V4 isolation (offline)
        run: python -B -m pytest -q -p no:cacheprovider -rs tests/v6_runtime
      - name: V6 Module D - confirmation and setup lifecycle (focused)
        run: python -B -m pytest -q -p no:cacheprovider -rs tests/scanner_v6/test_confirmation.py
      - name: V6 Module E - paper execution and risk (focused)
        run: python -B -m pytest -q -p no:cacheprovider -rs tests/scanner_v6/test_execution.py
      - name: V6 script mode (every test file run as a script)
        run: |
          n=0
          for f in tests/scanner_v6/test_*.py; do
            python -B "$f" > /tmp/v6_script.log 2>&1 || { cat /tmp/v6_script.log; echo "FAILED: $f"; exit 1; }
            n=$((n + 1))
          done
          echo "script mode: $n files, 0 failures"
          test "$n" -ge 17

  shell:
    name: Shellcheck (deploy scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh deploy/v6/*.sh
