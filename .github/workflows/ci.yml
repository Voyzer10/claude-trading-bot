# Checks every push and pull request: the dashboard builds (with lint and type checks), the Python code
# compiles and the API answers, and the VPS shell scripts pass shellcheck.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  python:
    name: Python compile + API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/requirements.txt
      - run: pip install -r deploy/requirements.txt httpx
      - name: Compile every Python file
        run: python -m compileall -q -x '(node_modules|\.next)' .
      - name: API smoke test (local mode, no network)
        run: python tests/smoke_api.py
      - name: SMC playbook engine, scanner and agent (offline)
        run: python tests/test_smc_playbook.py
      - name: A-B-C-D entry acceptance tests (offline)
        run: python tests/test_abcd.py
      - name: Stops / targets touched between two runner checks exit at that level (offline)
        run: python tests/test_intrabar_exits.py
      - name: Live quotes never freeze (newest of meta / 1-minute close, 5-minute fallback) (offline)
        run: python tests/test_quotes.py
      - name: Trade Manager reactions (breakeven, profit lock, reversal, no follow-through) (offline)
        run: python tests/test_trade_manager.py
      - name: US long entry live-price check (offline)
        run: python tests/test_us_long_entry.py
      - name: Zerodha data only - order endpoints refused, login, instruments, ticks (offline)
        run: python tests/test_kite.py
      - name: F&O stocks as ATM options - contract, premium stop / target, sizing, switch (offline)
        run: python tests/test_fno_stock.py
      - name: Stock-option backtest pricing - theta, spread, charges, account fit (offline)
        run: python tests/test_fno_sv4.py
      - name: Scanner v4 = only v4 (rules paths off per account), v4 setup ticks, every market's settings (offline)
        run: python tests/test_v4_only.py
      - name: Live crypto prices (Coinbase public data only) - no key, private / order endpoints refused, ticks (offline)
        run: python tests/test_crypto_live.py
      - name: Live US prices (Alpaca market data) - paper key only, trading API refused, snapshots, ticks (offline)
        run: python tests/test_alpaca.py
      - name: Scanner v5 - the 0.146 level, cancels, mirror, naming, account gating (offline)
        run: python tests/test_scanner_v5.py
      - name: Dashboard watch lists (NSE / US quotes and breaks) (offline)
        run: python tests/test_watchlists.py
      - name: Scanner v2 finds the owner's setups, the agents record them, no trade (offline)
        run: python tests/test_scanner_setups.py
      - name: Bigger picture (pov.py) - 4h / weekly / monthly candles, last complete v4 setup, file, endpoint (offline)
        run: python tests/test_pov.py
      - name: Scanner v4 acceptance tests (primary, sequential OB/FVG secondary, version gate) (offline)
        run: python tests/test_scanner_v4.py
      - name: Scanner v3 sweep reversal + FVG/OB retest acceptance tests, v2 rollback (offline)
        run: python tests/test_sweep_reversal.py

  shell:
    name: Shellcheck (deploy scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh
